name: Build .deb for Ubuntu / Mint

# Builds an installable package for Ubuntu, Linux Mint and Debian.
#
# The job runs inside an ubuntu:22.04 container rather than directly on the
# runner. A compiled binary is tied to the C library it was built against and
# will not start on anything older, so pinning the build to 22.04 (glibc 2.35)
# covers Ubuntu 22.04+, Mint 21+ and Debian 12+ from a single build -- and it
# stays pinned even when GitHub retires the 22.04 runner image.

on:
  workflow_dispatch:          # run it by hand from the Actions tab
  release:
    types: [published]        # and automatically when a release is published
  push:
    tags:
      - 'Enhanced-*'

permissions:
  contents: write             # needed to attach the .deb to a release

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:22.04

    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git make ca-certificates \
            lazarus lcl lcl-gtk2 lcl-units lcl-utils \
            fpc fpc-source fp-units-rtl fp-units-misc fp-units-gfx \
            fp-units-gtk2 fp-units-db fp-units-math fp-units-net \
            libssl-dev libgtk2.0-dev \
            dpkg-dev fakeroot

      - uses: actions/checkout@v4

      - name: Mark the workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build the package
        run: bash docker-build/build-deb.sh

      - name: Check the package installs cleanly
        run: |
          apt-get update
          # apt resolves the package's own dependencies here, so a bad
          # dependency name fails the build instead of reaching a user.
          DEBIAN_FRONTEND=noninteractive apt-get install -y ./dist/*.deb
          test -x /usr/bin/cqrlog
          test -d /usr/share/cqrlog/ctyfiles
          echo "Installed cleanly, binary and data files both present."

      - uses: actions/upload-artifact@v4
        with:
          name: cqrlog-enhanced-deb
          path: dist/*.deb

      - name: Attach to the release
        id: attach
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apt-get install -y --no-install-recommends curl
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            -o /usr/share/keyrings/githubcli.gpg
          echo "deb [signed-by=/usr/share/keyrings/githubcli.gpg] https://cli.github.com/packages stable main" \
            > /etc/apt/sources.list.d/github-cli.list
          apt-get update && apt-get install -y gh
          TAG="${GITHUB_REF#refs/tags/}"
          [ "$GITHUB_EVENT_NAME" != "release" ] || TAG="${{ github.event.release.tag_name }}"
          gh release upload "$TAG" dist/*.deb --clobber --repo "$GITHUB_REPOSITORY"

  # Install the package the way a real user would, on the actual
  # distributions we claim to support -- including genuine Linux Mint images,
  # not just the Ubuntu they are built on.
  test-install:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - linuxmintd/mint21-amd64     # Mint 21 (Ubuntu 22.04 base)
          - linuxmintd/mint22-amd64     # Mint 22 (Ubuntu 24.04 base)
          - ubuntu:22.04
          - ubuntu:24.04
          - debian:12
    container: ${{ matrix.image }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cqrlog-enhanced-deb

      - name: Install the package
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y ./cqrlog-enhanced_*.deb

      - name: Check the files landed
        run: |
          test -x /usr/bin/cqrlog
          test -d /usr/share/cqrlog/ctyfiles
          test -f /usr/share/cqrlog/changelog.html
          test -f /usr/share/applications/cqrlog.desktop

      - name: Check every shared library resolves
        run: |
          # The failure mode this whole container-build exists to prevent is a
          # binary that cannot find its libraries on the user's distribution.
          # ldd -r reports unresolved libraries and symbols; either is fatal.
          apt-get install -y --no-install-recommends binutils
          ldd -r /usr/bin/cqrlog > /tmp/ldd.txt 2>&1 || true
          cat /tmp/ldd.txt
          if grep -qE 'not found|undefined symbol' /tmp/ldd.txt; then
            echo "::error::Unresolved libraries or symbols on ${{ matrix.image }}"
            exit 1
          fi
          echo "All libraries resolve on ${{ matrix.image }}."

      - name: Check OpenSSL loads the way Synapse loads it
        run: |
          # Synapse dlopens the BARE soname (LoadLib('libssl.so') in
          # src/synapse/ssl_openssl_lib.pas), and on Debian/Ubuntu that
          # unversioned symlink lives in libssl-dev, not libssl3. If it is
          # missing, TLS silently never initialises and every HTTPS feature --
          # update check, LoTW, eQSL, QRZ.com upload, callbook lookups, POTA
          # spots -- fails with no error at all. ctypes.CDLL is the same
          # dlopen call, so this reproduces it exactly.
          apt-get install -y --no-install-recommends python3-minimal
          python3 -c "
          import ctypes, sys
          for lib in ('libssl.so', 'libcrypto.so'):
              try:
                  ctypes.CDLL(lib)
                  print('loaded', lib)
              except OSError as e:
                  print('::error::cannot dlopen', lib, '->', e)
                  sys.exit(1)
          print('TLS will initialise on ${{ matrix.image }}.')
          "

      - name: Check it actually starts
        run: |
          # Installing proves the dependencies are named right; launching proves
          # the binary really runs on this distribution. A missing library kills
          # it immediately, so surviving a few seconds under a virtual display
          # is the signal we want.
          apt-get install -y --no-install-recommends xvfb
          Xvfb :99 -screen 0 1024x768x24 >/dev/null 2>&1 &
          sleep 3
          DISPLAY=:99 /usr/bin/cqrlog > /tmp/cqrlog.log 2>&1 &
          APP=$!
          sleep 20
          if kill -0 "$APP" 2>/dev/null; then
            echo "cqrlog started and stayed running on ${{ matrix.image }}."
            kill "$APP" 2>/dev/null || true
          else
            wait "$APP" 2>/dev/null; RC=$?
            echo "::error::cqrlog exited early (code $RC) on ${{ matrix.image }}"
            cat /tmp/cqrlog.log
            exit 1
          fi
